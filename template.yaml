AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Aurora Serverless v1 (PostgreSQL) Username Registrar (API Gateway + Lambda + Data API)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tracing: Active

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: aurora-registrar-secret
      GenerateSecretString:
        SecretStringTemplate: '{"username":"postgres"}'
        GenerateStringKey: "password"
        PasswordLength: 24
        ExcludePunctuation: true

  DbCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineMode: serverless
      DatabaseName: appdb
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      EnableHttpEndpoint: true
      WithExpressConfiguration: true
      ScalingConfiguration:
        AutoPause: true
        MinCapacity: 2
        MaxCapacity: 2
        SecondsUntilAutoPause: 300

  InitSchemaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.init_schema_handler
      CodeUri: src/
      Environment:
        Variables:
          DB_ARN: !Ref DbCluster
          SECRET_ARN: !Ref DbSecret
          DB_NAME: appdb
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecret

  InitSchema:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt InitSchemaFunction.Arn

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.register_handler
      CodeUri: src/
      Environment:
        Variables:
          DB_ARN: !Ref DbCluster
          SECRET_ARN: !Ref DbSecret
          DB_NAME: appdb
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /register
            Method: POST

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  DbClusterArn:
    Value: !Ref DbCluster
  SecretArn:
    Value: !Ref DbSecret
