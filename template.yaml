AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Lab 2 - Async Image Metadata Pipeline. Upload images to incoming/,
  inspect metadata asynchronously, and persist metadata/ JSON outputs.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Tracing: Active

Resources:
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub images-${AWS::AccountId}-${AWS::Region}

  MetadataQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub image-metadata-${AWS::AccountId}-${AWS::Region}
      VisibilityTimeout: 120

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ingest
      Handler: app.lambda_handler
      Description: Validates incoming image uploads and forwards metadata requests.
      Environment:
        Variables:
          QUEUE_URL: !Ref MetadataQueue
      Policies:
        - Statement:
            - Sid: AllowQueueSend
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt MetadataQueue.Arn
            - Sid: AllowIncomingRead
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::images-${AWS::AccountId}-${AWS::Region}/incoming/*
      Events:
        IncomingImages:
          Type: S3
          Properties:
            Bucket: !Ref ImagesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/

  MetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/metadata
      Handler: app.lambda_handler
      Description: Consumes queue messages, reads images, and writes metadata JSON.
      Environment:
        Variables:
          METADATA_PREFIX: metadata/
          DESTINATION_BUCKET: !Sub images-${AWS::AccountId}-${AWS::Region}
      Policies:
        - Statement:
            - Sid: AllowQueueConsume
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt MetadataQueue.Arn
            - Sid: AllowIncomingRead
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::images-${AWS::AccountId}-${AWS::Region}/incoming/*
            - Sid: AllowMetadataWrite
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::images-${AWS::AccountId}-${AWS::Region}/metadata/*
            - Sid: AllowMetadataList
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub arn:${AWS::Partition}:s3:::images-${AWS::AccountId}-${AWS::Region}
              Condition:
                StringLike:
                  's3:prefix':
                    - metadata/*
      Events:
        MetadataQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MetadataQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0

Outputs:
  BucketName:
    Description: Images bucket for uploads and metadata outputs.
    Value: !Ref ImagesBucket
  QueueUrl:
    Description: URL for the metadata processing queue.
    Value: !Ref MetadataQueue
  QueueArn:
    Description: ARN for the metadata queue.
    Value: !GetAtt MetadataQueue.Arn
