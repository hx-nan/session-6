AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Async S3->Lambda->SQS->Lambda(HF image classification)->S3, loop prevention + idempotency.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures: [x86_64]
    Tracing: Active

Resources:
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub images-${AWS::AccountId}-${AWS::Region}

  InferenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub image-inference-${AWS::AccountId}-${AWS::Region}
      VisibilityTimeout: 60

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ingest/
      Handler: app.lambda_handler
      Environment:
        Variables:
          QUEUE_URL: !Ref InferenceQueue
          INPUT_PREFIX: incoming/
          # Suffix filtering is enforced both in S3 event filter and in code (defense-in-depth).
          ALLOWED_SUFFIXES: ".png,.jpg,.jpeg"
      Policies:
        # Least-privilege inline policy
        - Statement:
            - Sid: ReadIncomingForHeadEtag
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::images-${AWS::AccountId}-${AWS::Region}/incoming/*
            - Sid: SendToQueue
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt InferenceQueue.Arn
      Events:
        ImageUpload:
          Type: S3
          Properties:
            Bucket: !Ref ImagesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
                  # SAM supports one suffix rule; we keep .jpg here and enforce others in code.
                  - Name: suffix
                    Value: .jpg

  InferFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/infer/
      Handler: app.lambda_handler
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          INPUT_PREFIX: incoming/
          OUTPUT_PREFIX: predictions/
          TOP_K: "3"
          # Choose any public HF image classification model that the Inference API supports.
          # Keep it simple for a class lab; students can swap the model_id.
          HF_MODEL_ID: google/vit-base-patch16-224
          # Recommended: set HF_TOKEN as a real secret outside the template (e.g., GitHub Actions / SAM deploy env).
          # If omitted, the Inference API may still work for some models but can be rate-limited.
          HF_TOKEN: ""
      Policies:
        - Statement:
            - Sid: ReadIncomingImages
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::images-${AWS::AccountId}-${AWS::Region}/incoming/*
            - Sid: WritePredictions
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub arn:aws:s3:::images-${AWS::AccountId}-${AWS::Region}/predictions/*
            - Sid: ReadPredictionsForIdempotency
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::images-${AWS::AccountId}-${AWS::Region}/predictions/*
            - Sid: ListPredictionsForIdempotency
              Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub arn:aws:s3:::images-${AWS::AccountId}-${AWS::Region}
              Condition:
                StringLike:
                  s3:prefix:
                    - predictions/*
            - Sid: PollQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource: !GetAtt InferenceQueue.Arn
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt InferenceQueue.Arn
            BatchSize: 1

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref ImagesBucket

  QueueUrl:
    Description: SQS queue URL
    Value: !Ref InferenceQueue
